
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Products | Graina</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fbf8f0;
      color: #214b36;
    }

    header {
      background: #214b36;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header img {
      width: 145px;
      max-height: 55px;
      object-fit: contain;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .heading {
      text-align: center;
      padding: 24px 15px 16px;
    }

    .heading h1 {
      font-family: Georgia, serif;
      margin: 0 0 8px;
      font-size: 32px;
      color: #214b36;
    }

    .heading p {
      color: #667368;
      margin: 0;
    }

    .store {
      width: 100%;
      height: calc(100vh - 175px);
      min-height: 650px;
      border: 0;
      display: block;
      background: #fff;
    }

    .fallback {
      text-align: center;
      padding: 12px;
      font-size: 14px;
    }

    .fallback a {
      color: #214b36;
      font-weight: bold;
    }

    @media(max-width:600px) {
      .heading h1 {
        font-size: 25px;
      }

      .store {
        height: calc(100vh - 160px);
        min-height: 650px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">
      <img src="https://www.graina.in/images/graina-logo.png"
           alt="Graina Logo">
    </a>

    <a href="index.html">← Back to Home</a>
  </header>

  <section class="heading">
    <h1>Shop Graina Products</h1>
    <p>Goodness in Every Grain.</p>
  </section>

  <iframe
    class="store"
    src="https://pages.razorpay.com/stores/st_R383DGTXRI9eGO"
    title="Graina Online Store"
    allow="payment *">
  </iframe>

  <div class="fallback">
    If the store does not appear,
    <a href="https://pages.razorpay.com/stores/st_R383DGTXRI9eGO"
       target="_blank" rel="noopener noreferrer">
      Open Graina Store here
    </a>.
  </div>

</body>
</html>
